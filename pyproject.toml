[project]
name = "fobos-commerce-ledger"
version = "0.1.0"
description = "Commerce & Ledger core backend for the Financial Operations Platform (hackathon MVP)"
requires-python = ">=3.12"

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["migrations", "tests"]
skips = ["B101", "B107"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=config --cov=accounts --cov=products --cov=ledger --cov=sales --cov=payments --cov=automation --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=junit.xml"
testpaths = ["accounts", "products", "ledger", "sales", "payments", "automation"]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings.py",
    "manage.py",
]