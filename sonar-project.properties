# EDIT THESE before enabling SonarCloud: they MUST match an actual project
# created on https://sonarcloud.io (organization key + project key).
sonar.projectKey=fobos_commerce_ledger
sonar.projectName=FOBOS Commerce & Ledger
sonar.organization=fobos

# Global analysis settings
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Sources: every Django app of the project (config + accounts + all core business apps).
sonar.sources=config,accounts,automation,ledger,payments,products,sales

# Tests: all app test modules.
sonar.tests=accounts,automation,ledger,payments,products,sales

# Reports produced by pytest (--cov-report=xml + --junitxml, see pyproject.toml).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.junit.reportPaths=junit.xml

# Never analyze generated/boilerplate code.
sonar.exclusions=**/migrations/**,**/tests/**,**/conftest.py

sonar.qualitygate.wait=true