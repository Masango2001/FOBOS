databases:
  - name: fobos-commerce-ledger-db
    databaseName: fobos
    user: fobos
    plan: free

services:
  - type: web
    name: fobos-commerce-ledger-api
    runtime: docker
    repo: https://github.com/Masango2001/FOBOS.git
    branch: feat/openapi-api-view-contracts
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: fobos-commerce-ledger-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: POSTGRES_DB
        fromDatabase:
          name: fobos-commerce-ledger-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: fobos-commerce-ledger-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: fobos-commerce-ledger-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: fobos-commerce-ledger-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: fobos-commerce-ledger-db
          property: port
      - key: MEDIA_ROOT
        value: /tmp/fobos-media
      - key: APP_BASE_URL
        fromService:
          name: fobos-commerce-ledger-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FOBOS_USE_DEMO_ADAPTERS
        value: "true"
      - key: FOBOS_USE_LIVE_ADAPTERS
        value: "false"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: CORS_ALLOWED_ORIGINS
        value: https://fobos-pos.vercel.app
