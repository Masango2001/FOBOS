# Project name pinned so the built web image is ALWAYS "fobos-web",
# regardless of the folder name the repo is checked out into.
# The CI's Trivy job scans image-ref "fobos-web".
name: fobos

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fobos}
      POSTGRES_USER: ${POSTGRES_USER:-fobos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fobos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fobos} -d ${POSTGRES_DB:-fobos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      args:
        FOBOS_INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file: ${ENV_FILE:-.env.dev}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media:
