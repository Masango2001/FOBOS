<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email — Financial Operations Platform</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
        <tr>
            <td align="center" style="padding:40px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e4e4e7;">
                    <tr>
                        <td style="padding:32px 32px 8px 32px;">
                            <h1 style="margin:0;font-size:20px;color:#18181b;">Vérifiez votre email</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 24px 32px;">
                            <p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#3f3f46;">
                                Merci de vous être inscrit·e sur la Plateforme d'Opérations Financières.
                                Confirmez votre adresse email en cliquant sur le bouton ci-dessous.
                            </p>
                            <!-- Le lien signé n'apparaît QUE dans le href du bouton, jamais en texte clair. -->
                            <a href="{{ verify_url|safe }}" style="display:inline-block;background-color:#FF7500;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;padding:14px 28px;border-radius:8px;">
                                Vérifier mon email
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 28px 32px;">
                            <p style="margin:0;font-size:12px;line-height:1.5;color:#71717a;">
                                Ce lien est valide 24 heures. S'il a expiré, vous pouvez en demander un nouveau depuis l'application.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
